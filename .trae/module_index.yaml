# HRMS 项目模块索引
# 用于快速定位模块对应的前端页面、后端API、数据库表等
# 当添加新功能时，请同步更新此文件

version: "1.0"
lastUpdated: "2026-05-24"

modules:

  # ========================================
  # 员工花名册模块
  # ========================================
  - id: employee
    name: 员工花名册
    nameEn: Employee Management
    category: 人事管理
    description: 管理员工基本信息、合同、薪资模式等

    frontend:
      pages:
        - path: src/views/employee/EmployeeList.vue
          name: 员工列表
          route: /employees
          componentName: EmployeeList
          description: 员工主列表页面，包含查询、新增、编辑、批量操作
          lists:
            - name: 员工主列表
              dataKey: data
              pagination: true
              rowKey: id
              columns:
                - key: employeeType
                  title: 员工类型
                - key: salaryMode
                  title: 薪资模式
                - key: hireDate
                  title: 入职日期
                - key: tags
                  title: 标签
                - key: isActive
                  title: 状态
                - key: action
                  title: 操作
          buttons:
            toolbar:
              - permission: button.employee.create
                text: 新增员工
                icon: PlusOutlined
                action: showAddModal
                type: primary
              - permission: button.employee.import
                text: 批量导入
                icon: UploadOutlined
                action: handleBatchImport
              - permission: button.employee.export
                text: 批量导出
                icon: DownloadOutlined
                action: handleBatchExport
              - permission: button.employee.dismiss
                text: 批量离职
                icon: UserDeleteOutlined
                action: handleBatchDismiss
                danger: true
                condition: selectedRows.length > 0
              - text: 刷新
                icon: SyncOutlined
                action: loadData
            rowActions:
              - permission: (无权限控制)
                text: 查看
                action: handleView
              - permission: button.employee.edit
                text: 编辑
                action: handleEdit
              - permission: button.employee.dismiss
                text: 离职/复职
                action: handleToggleDismiss
                danger: true
              - permission: button.employee.resetPassword
                text: 重置密码
                action: handleResetPassword
          modals:
            - name: 新增/编辑员工弹窗
              title: 新增员工 / 编辑员工
              fields:
                - step: 0
                  title: 基本信息
                  fields:
                    - name: employeeNo
                      label: 工号
                      type: input
                      required: true
                    - name: name
                      label: 姓名
                      type: input
                      required: true
                    - name: gender
                      label: 性别
                      type: radio
                    - name: idCard
                      label: 身份证号
                      type: input
                      required: true
                    - name: phone
                      label: 手机号
                      type: input
                      required: true
                - step: 1
                  title: 组织信息
                  fields:
                    - name: orgUnitId
                      label: 所属组织
                      type: treeSelect
                      required: true
                    - name: employeeType
                      label: 员工类型
                      type: select
                - step: 2
                  title: 薪资信息
                - step: 3
                  title: 合同信息
          queryFields:
            - name: keyword
              label: 关键字
              placeholder: 工号/姓名/身份证/手机
              type: input
            - name: orgUnitId
              label: 所属组织
              type: treeSelect
            - name: employeeType
              label: 员工类型
              type: select
            - name: isActive
              label: 状态
              type: select

        - path: src/views/employee/EmployeeDetailView.vue
          name: 员工详情
          route: /employees/detail/:id
          componentName: EmployeeDetailView

    apiFiles:
      - path: src/api/index.js
        functions:
          - getEmployeeList
          - getEmployee
          - createEmployee
          - updateEmployee
          - deleteEmployee
          - batchImportEmployees
          - batchExportEmployees
          - resetEmployeePassword

    backend:
      controllers:
        - path: src/HRMS.API/Controllers/EmployeesController.cs
          methods:
            - GET /api/v1/employees
            - GET /api/v1/employees/{id}
            - POST /api/v1/employees
            - PUT /api/v1/employees/{id}
            - DELETE /api/v1/employees/{id}
            - POST /api/v1/employees/batch-import
            - POST /api/v1/employees/{id}/reset-password
      services:
        - path: src/HRMS.Application/Services/EmployeeService.cs
          methods:
            - GetEmployeeListAsync
            - GetEmployeeByIdAsync
            - CreateEmployeeAsync
            - UpdateEmployeeAsync
            - DeleteEmployeeAsync
            - ResetPasswordAsync
      repositories:
        - path: src/HRMS.Infrastructure/Repositories/EmployeeRepository.cs
        - path: src/HRMS.Domain/Interfaces/IEmployeeRepository.cs
      entities:
        - path: src/HRMS.Domain/Entities/Employee.cs
          tableName: sys_employee
          fields:
            - id
            - employeeNo
            - name
            - gender
            - idCard
            - phone
            - orgUnitId
            - employeeType
            - salaryMode
            - hireDate
            - isActive
            - tags

    database:
      tables:
        - name: sys_employee
          description: 员工主表
          columns:
            - id (PK)
            - employee_no
            - name
            - gender
            - id_card
            - phone
            - org_unit_id (FK)
            - employee_type
            - salary_mode
            - hire_date
            - is_active
            - tags (JSON)
            - created_at
            - updated_at
        - name: sys_user
          description: 系统用户表（员工登录账号）
        - name: sys_user_role
          description: 用户角色关联表
        - name: sys_post
          description: 岗位表

    menuKey: employee-list
    permissionCode: page.employee.list

  # ========================================
  # 组织架构管理模块
  # ========================================
  - id: org-unit
    name: 组织架构管理
    nameEn: Organization Unit Management
    category: 人事管理
    description: 管理组织单元、部门、岗位等

    frontend:
      pages:
        - path: src/views/org/OrgUnitList.vue
          name: 组织单元列表
          route: /org-units
          componentName: OrgUnitList
          description: 组织树形列表，支持CRUD操作
          lists:
            - name: 组织树形列表
              dataKey: treeData
              type: tree
              columns:
                - name: name
                  title: 组织名称
                - name: code
                  title: 组织编码
                - name: managerName
                  title: 负责人
                - name: employeeCount
                  title: 员工数
                - name: isActive
                  title: 状态
                - name: action
                  title: 操作
          buttons:
            toolbar:
              - permission: button.org.create
                text: 新增组织
                icon: PlusOutlined
                action: showAddModal
                type: primary
              - permission: button.org.import
                text: 批量导入
                icon: UploadOutlined
                action: handleBatchImport
              - permission: button.org.export
                text: 批量导出
                icon: DownloadOutlined
                action: handleBatchExport
            treeContextMenu:
              - permission: button.org.create
                text: 新增子节点
                key: add-child
                action: handleAddChild
              - permission: button.org.edit
                text: 编辑
                key: edit
                action: handleEditFromTree
              - permission: button.org.delete
                text: 删除
                key: delete
                action: handleDeleteFromTree
                danger: true
            rowActions:
              - permission: button.org.edit
                text: 编辑
                action: handleEdit
              - permission: button.org.enable
                text: 启用
                action: handleEnable
                condition: record.isActive === false
              - permission: button.org.disable
                text: 停用
                action: handleDisable
                danger: true
                condition: record.isActive === true
              - permission: button.org.delete
                text: 删除
                action: handleDelete
                danger: true

        - path: src/views/org/OrgUnitManagement.vue
          name: 组织管理
          route: /org-units/management

        - path: src/views/org/OrgChartView.vue
          name: 组织图
          route: /org-units/management/chart
          componentName: OrgChartView
          description: 可视化组织架构图

        - path: src/views/org/OrgTreeBranch.vue
          name: 组织分支
          route: /org-units/tree-branch

    apiFiles:
      - path: src/api/index.js
        functions:
          - getOrgTree
          - getOrgUnit
          - createOrgUnit
          - updateOrgUnit
          - deleteOrgUnit
          - batchImportOrgUnits
          - batchExportOrgUnits
          - enableOrgUnit
          - disableOrgUnit

    backend:
      controllers:
        - path: src/HRMS.API/Controllers/OrgUnitsController.cs
          methods:
            - GET /api/v1/org-units/tree
            - GET /api/v1/org-units/{id}
            - POST /api/v1/org-units
            - PUT /api/v1/org-units/{id}
            - DELETE /api/v1/org-units/{id}
            - POST /api/v1/org-units/{id}/enable
            - POST /api/v1/org-units/{id}/disable
      services:
        - path: src/HRMS.Application/Services/OrgUnitService.cs
      repositories:
        - path: src/HRMS.Infrastructure/Repositories/OrgUnitRepository.cs
        - path: src/HRMS.Domain/Interfaces/IOrgUnitRepository.cs
      entities:
        - path: src/HRMS.Domain/Entities/OrgUnit.cs
          tableName: sys_org_unit

    database:
      tables:
        - name: sys_org_unit
          description: 组织单元表
          columns:
            - id (PK)
            - parent_id
            - name
            - code
            - manager_id
            - is_active
            - sort_order
        - name: sys_post
          description: 岗位表

    menuKey: org-unit-list
    permissionCode: page.org.unit

  # ========================================
  # 考勤管理模块
  # ========================================
  - id: timesheet
    name: 考勤管理
    nameEn: Timesheet Management
    category: 考勤薪资
    description: 管理员工考勤数据、导入、审批等

    frontend:
      pages:
        - path: src/views/timesheet/TimesheetList.vue
          name: 考勤列表
          route: /timesheets
          componentName: TimesheetList
          lists:
            - name: 考勤记录列表
              dataKey: data
              pagination: true
              rowKey: id
              columns:
                - name: employeeNo
                  title: 工号
                - name: employeeName
                  title: 姓名
                - name: date
                  title: 日期
                - name: checkIn
                  title: 签到时间
                - name: checkOut
                  title: 签退时间
                - name: status
                  title: 状态
                - name: action
                  title: 操作
          buttons:
            toolbar:
              - permission: button.timesheet.create
                text: 新增考勤
                icon: PlusOutlined
                action: showAddModal
                type: primary
              - permission: page.timesheet.import
                text: 导入
                icon: UploadOutlined
                action: (路由跳转 /timesheets/import)
              - permission: button.timesheet.approve
                text: 审批
                icon: CheckOutlined
                action: handleApprove
            rowActions:
              - permission: button.timesheet.approve
                text: 审批
                action: handleApprove

        - path: src/views/timesheet/TimesheetImport.vue
          name: 考勤导入
          route: /timesheets/import
          componentName: TimesheetImport

    apiFiles:
      - path: src/api/index.js
        functions:
          - timesheetApi.getTimesheets
          - timesheetApi.createTimesheet
          - timesheetApi.approveTimesheet
          - timesheetApi.importTimesheets
          - timesheetApi.exportTimesheets

    backend:
      controllers:
        - path: src/HRMS.API/Controllers/TimesheetsController.cs
      services:
        - path: src/HRMS.Application/Services/TimesheetService.cs
      repositories:
        - path: src/HRMS.Infrastructure/Repositories/TimesheetRepository.cs
        - path: src/HRMS.Domain/Interfaces/ITimesheetRepository.cs
      entities:
        - path: src/HRMS.Domain/Entities/Timesheet.cs
          tableName: timesheet

    database:
      tables:
        - name: timesheet
          description: 考勤记录表
        - name: timesheet_detail
          description: 考勤明细表

    menuKey: timesheet-list
    permissionCode: page.timesheet

  # ========================================
  # 薪资管理模块
  # ========================================
  - id: salary
    name: 薪资管理
    nameEn: Salary Management
    category: 考勤薪资
    description: 薪资计算、规则配置、薪资单生成等

    frontend:
      pages:
        - path: src/views/salary/SalaryList.vue
          name: 薪资列表
          route: /salary
          componentName: SalaryList
          description: 薪资单列表，支持计算、审批、生成工资条
          lists:
            - name: 薪资单列表
              dataKey: data
              pagination: true
              rowKey: id
              columns:
                - name: runNo
                  title: 薪资单号
                - name: period
                  title: 薪资期间
                - name: employeeCount
                  title: 员工数
                - name: totalAmount
                  title: 总金额
                - name: status
                  title: 状态
                - name: createdAt
                  title: 创建时间
                - name: action
                  title: 操作
          buttons:
            toolbar:
              - permission: page.salary.calculate
                text: 薪资计算
                icon: CalculatorOutlined
                action: (路由跳转 /salary/calculate)
                type: primary
              - permission: button.salary.approve
                text: 审批
                icon: CheckOutlined
                action: handleApprove
              - permission: button.salary.generatePayslip
                text: 生成工资条
                icon: FileTextOutlined
                action: handleGeneratePayslip
              - permission: button.salary.adjust
                text: 调整
                icon: EditOutlined
                action: handleAdjust
            rowActions:
              - permission: button.salary.approve
                text: 审批
                action: handleApprove
              - permission: button.salary.generatePayslip
                text: 生成工资条
                action: handleGeneratePayslip
              - permission: button.salary.adjust
                text: 调整
                action: handleAdjust

        - path: src/views/salary/SalaryCalculate.vue
          name: 薪资计算
          route: /salary/calculate
          componentName: SalaryCalculate

    apiFiles:
      - path: src/api/index.js
        functions:
          - salaryApi.getSalaryList
          - salaryApi.calculateSalary
          - salaryApi.approveSalary
          - salaryApi.generatePayslip
          - salaryApi.adjustSalary

    backend:
      controllers:
        - path: src/HRMS.API/Controllers/SalaryController.cs
      services:
        - path: src/HRMS.Application/Services/SalaryCalculationService.cs
        - path: src/HRMS.Application/Services/SalaryRuleService.cs
        - path: src/HRMS.Application/Services/SalaryAdjustmentService.cs
      repositories:
        - path: src/HRMS.Infrastructure/Repositories/SalaryCalculationRepository.cs
        - path: src/HRMS.Domain/Interfaces/ISalaryCalculationRepository.cs
      entities:
        - path: src/HRMS.Domain/Entities/SalaryCalculation.cs
        - path: src/HRMS.Domain/Entities/Payslip.cs

    database:
      tables:
        - name: salary_calculation
          description: 薪资计算表
        - name: payslip
          description: 工资条表
        - name: salary_rule
          description: 薪资规则表
        - name: salary_adjustment
          description: 薪资调整表

    menuKey: salary-list
    permissionCode: page.salary

  # ========================================
  # 薪资核算模块（薪资单/工资条）
  # ========================================
  - id: payroll
    name: 薪资核算
    nameEn: Payroll Run
    category: 考勤薪资
    description: 薪资核算批次、薪资配置、考勤关联等

    frontend:
      pages:
        - path: src/views/payroll/PayrollRunList.vue
          name: 薪资核算列表
          route: /payroll/run

    apiFiles:
      - path: src/api/index.js
        functions:
          - payrollRunApi

    backend:
      controllers:
        - path: src/HRMS.API/Controllers/PayrollRunController.cs
          methods:
            - GET /api/v1/payroll/runs
            - POST /api/v1/payroll/runs
            - POST /api/v1/payroll/runs/{id}/calculate
            - POST /api/v1/payroll/runs/{id}/approve
        - path: src/HRMS.API/Controllers/PayrollConfigController.cs
        - path: src/HRMS.API/Controllers/PayrollAdjustmentController.cs
        - path: src/HRMS.API/Controllers/PayrollAttendanceController.cs
        - path: src/HRMS.API/Controllers/PayrollProfileController.cs
      services:
        - path: src/HRMS.Application/Services/PayrollCalculationService.cs
        - path: src/HRMS.Application/Services/PayrollConfigServices.cs
        - path: src/HRMS.Application/Services/EmployeePayrollProfileService.cs
      repositories:
        - path: src/HRMS.Infrastructure/Repositories/PayrollRepositories.cs
      entities:
        - path: src/HRMS.Domain/Entities/PayrollModels.cs
        - path: src/HRMS.Domain/Entities/PayrollRun.cs
        - path: src/HRMS.Domain/Entities/PayrollProfile.cs

    database:
      tables:
        - name: payroll_run
          description: 薪资核算批次表
        - name: payroll_profile
          description: 员工薪资档案表
        - name: payroll_adjustment
          description: 薪资调整表
        - name: payroll_attendance
          description: 薪资考勤关联表

    menuKey: payroll-run
    permissionCode: page.payroll.run

  # ========================================
  # 系统配置模块
  # ========================================
  - id: settings
    name: 系统配置
    nameEn: System Settings
    category: 系统管理
    description: 系统参数配置

    frontend:
      pages:
        - path: src/views/settings/Settings.vue
          name: 系统设置
          route: /settings
          componentName: Settings

        - path: src/views/config/ConfigManagement.vue
          name: 配置管理
          route: /config
          componentName: ConfigManagement

    backend:
      controllers:
        - path: src/HRMS.API/Controllers/SettingsController.cs
      services:
        - path: src/HRMS.API/Services/SettingsService.cs
      entities:
        - path: src/HRMS.Domain/Entities/SysConfigParam.cs

    database:
      tables:
        - name: sys_config_param
          description: 系统配置参数表

    menuKey: settings-page
    permissionCode: page.settings

  # ========================================
  # 权限管理模块
  # ========================================
  - id: access-control
    name: 权限管理
    nameEn: Access Control
    category: 系统管理
    description: 用户、角色、岗位、菜单管理

    frontend:
      pages:
        - path: src/views/access/UserManagement.vue
          name: 用户管理
          route: /access/users
          componentName: UserManagement
          description: 系统用户CRUD
          lists:
            - name: 用户列表
              dataKey: data
              pagination: true
              rowKey: id
              columns:
                - name: username
                  title: 用户名
                - name: name
                  title: 姓名
                - name: email
                  title: 邮箱
                - name: isActive
                  title: 状态
                - name: action
                  title: 操作
          buttons:
            toolbar:
              - permission: button.access.user.create
                text: 新增用户
                icon: PlusOutlined
                action: openCreateModal
                type: primary
            rowActions:
              - permission: button.access.user.edit
                text: 编辑
                action: openEditModal
              - permission: button.access.user.delete
                text: 删除
                action: handleDelete
                danger: true

        - path: src/views/access/RoleManagement.vue
          name: 角色管理
          route: /access/roles
          componentName: RoleManagement
          description: 角色CRUD、权限分配
          lists:
            - name: 角色列表
              dataKey: data
              pagination: true
              rowKey: id
              columns:
                - name: roleName
                  title: 角色名称
                - name: roleCode
                  title: 角色编码
                - name: description
                  title: 描述
                - name: isActive
                  title: 状态
                - name: action
                  title: 操作
          buttons:
            toolbar:
              - permission: button.access.role.create
                text: 新增角色
                icon: PlusOutlined
                action: openCreateModal
                type: primary
            rowActions:
              - permission: button.access.role.edit
                text: 编辑
                action: openEditModal
              - permission: button.access.role.assign
                text: 分配权限
                action: openPermissionDrawer
              - permission: button.access.role.assign
                text: 复制权限
                action: openCopyModal
              - permission: button.access.role.delete
                text: 删除
                action: handleDelete
                danger: true

        - path: src/views/access/PostManagement.vue
          name: 岗位管理
          route: /access/posts
          componentName: PostManagement

        - path: src/views/access/MenuManagement.vue
          name: 菜单管理
          route: /access/menus
          componentName: MenuManagement
          description: 菜单树形管理、排序
          lists:
            - name: 菜单树
              dataKey: menuTree
              type: tree
              columns:
                - name: menuName
                  title: 菜单名称
                - name: menuKey
                  title: 菜单Key
                - name: routePath
                  title: 路由路径
                - name: permissionCode
                  title: 权限码
                - name: sortOrder
                  title: 排序
                - name: action
                  title: 操作
          buttons:
            toolbar:
              - permission: button.access.menu.create
                text: 新增菜单
                icon: PlusOutlined
                action: openCreateModal
                type: primary
            rowActions:
              - permission: button.access.menu.edit
                text: 排序
                action: openSortModal
              - permission: button.access.menu.create
                text: 新增子节点
                action: openCreateModal
              - permission: button.access.menu.edit
                text: 编辑
                action: openEditModal
              - permission: button.access.menu.delete
                text: 删除
                action: handleDelete
                danger: true

    apiFiles:
      - path: src/api/index.js
        functions:
          - accessApi.getUsers
          - accessApi.createUser
          - accessApi.updateUser
          - accessApi.deleteUser
          - accessApi.getRoles
          - accessApi.createRole
          - accessApi.updateRole
          - accessApi.deleteRole
          - accessApi.assignPermissions
          - accessApi.getMenus
          - accessApi.createMenu
          - accessApi.updateMenu
          - accessApi.deleteMenu
          - accessApi.sortMenu

    backend:
      controllers:
        - path: src/HRMS.API/Controllers/AccessController.cs
          methods:
            - GET /api/v1/access/users
            - POST /api/v1/access/users
            - PUT /api/v1/access/users/{id}
            - DELETE /api/v1/access/users/{id}
            - GET /api/v1/access/roles
            - POST /api/v1/access/roles
            - PUT /api/v1/access/roles/{id}
            - DELETE /api/v1/access/roles/{id}
            - POST /api/v1/access/roles/{id}/permissions
            - GET /api/v1/access/menus
            - POST /api/v1/access/menus
            - PUT /api/v1/access/menus/{id}
            - DELETE /api/v1/access/menus/{id}
            - PUT /api/v1/access/menus/sort
        - path: src/HRMS.API/Controllers/AuthController.cs
      services:
        - path: src/HRMS.API/Services/AccessControlService.cs
        - path: src/HRMS.API/Services/RbacDataInitializer.cs
      entities:
        - path: src/HRMS.Domain/Entities/SysUser.cs
        - path: src/HRMS.Domain/Entities/SysRole.cs
        - path: src/HRMS.Domain/Entities/SysMenu.cs
