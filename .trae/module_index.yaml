  # ========================================
  # 流程设计器模块
  # ========================================
  - id: process-designer
    name: 流程设计器
    nameEn: Process Designer
    category: 流程管理
    description: 可视化BPMN流程设计器

    frontend:
      pages:
        - path: src/views/workflow/ProcessDesigner.vue
          name: 流程设计器
          route: /workflow/designer
          componentName: ProcessDesigner
          description: 基于bpmn-js的可视化流程设计器
          features:
            - 节点拖拽（开始事件、结束事件、用户任务、服务任务、网关）
            - 流程模板（简单审批流、多级审批流、条件分支流、费用申请流）
            - 节点属性编辑（名称、类型、审批人、优先级等）
            - 撤销/重做
            - 缩放控制
            - 保存/发布
          panels:
            - name: 左侧面板
              type: palette
              content: 基础节点、常用模板
            - name: 中间画布
              type: canvas
              content: BPMN流程图
            - name: 右侧面板
              type: properties
              content: 流程属性、节点属性
          templates:
            - name: 简单审批流
              key: simple
              description: 开始 -> 审批 -> 结束
            - name: 多级审批流
              key: approval
              description: 开始 -> 经理审批 -> 总监审批 -> 人事审批 -> 结束
            - name: 条件分支流
              key: branch
              description: 开始 -> 条件判断 -> (经理审批|自动处理) -> 结束
            - name: 费用申请流
              key: expense
              description: 开始 -> 填写费用 -> 金额判断 -> (部门|分公司|总公司)审批 -> 结束
              conditions:
                - expression: "amount <= 1000"
                  target: 部门审批
                - expression: "amount > 1000 && amount <= 5000"
                  target: 分公司审批
                - expression: "amount > 5000"
                  target: 总公司审批
          businessTypes:
            - value: Leave
              label: 请假审批
            - value: Payroll
              label: 薪资核算
            - value: Expense
              label: 费用申请
            - value: Purchase
              label: 采购申请
            - value: Reimbursement
              label: 报销申请

    apiFiles:
      - path: src/api/index.js
        functions:
          - processCenterApi.getDefinition
          - processCenterApi.saveDefinition

    backend:
      controllers:
        - path: src/HRMS.API/Controllers/ProcessCenterController.cs
          methods:
            - GET /api/v1/process/definitions/{id}
            - POST /api/v1/process/definitions
            - PUT /api/v1/process/definitions/{id}
      gateways:
        - path: src/HRMS.API/Services/WorkflowCenterGateway.cs
          interface: IWorkflowProcessCenterGateway
          methods:
            - GetDefinitionAsync
            - SaveDefinitionAsync
      microservices:
        - path: src/ProcessCenter.API/
      dependencies:
        - name: bpmn-js
          type: npm package
          version: latest
        - name: bpmn-js-properties-panel
          type: npm package
        - name: @bpmn-io/properties-panel
          type: npm package
        - name: micromodal
          type: npm package

    database:
      tables:
        - name: process_definition
          description: 流程定义表
        - name: process_definition_node
          description: 流程节点定义表

    menuKey: process-designer-page
    permissionCode: page.process.designer

