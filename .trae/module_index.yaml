# ========================================
# 操作规则说明
# ========================================
operation_rules:
  description: |
    当收到用户的指令时，按照以下规则操作：

    1. 识别模块名称：
       - "员工" 或 "花名册" → employee
       - "组织" 或 "架构" → org-unit
       - "考勤" → timesheet
       - "薪资" → salary 或 payroll
       - "待办" → todo-center
       - "流程" 或 "审批" → process-center 或 process-designer
       - "权限" 或 "用户" 或 "角色" → access-control
       - "配置" 或 "系统设置" → settings

    2. 定位文件：
       - 前端页面：查找 modules[?id=<module_id>].frontend.pages
       - 后端控制器：查找 modules[?id=<module_id>].backend.controllers
       - 数据库表：查找 modules[?id=<module_id>].database.tables

    3. 执行操作：
       - 添加功能 → 在 frontend.pages + backend.controllers + database.tables 中添加
       - 修改功能 → 定位具体文件后修改
       - 删除功能 → 从上述三个位置删除

    4. 跨模块操作：
       - 如果操作涉及多个模块，明确告知用户
       - 例如：薪资计算可能涉及 salary + payroll + todo-center

  examples:
    - instruction: "在【薪资计算模块】中添加一个字段：社保基数"
      actions:
        - module: salary
          files:
            - frontend: src/views/salary/SalaryCalculate.vue
            - backend: src/HRMS.Application/Services/SalaryCalculationService.cs
            - entity: src/HRMS.Domain/Entities/SalaryCalculation.cs
            - database: salary_calculation 表添加 social_security_base 字段
          cross_module_warning: false

    - instruction: "打开【组织架构模块】的页面"
      actions:
        - module: org-unit
          files:
            - src/views/org/OrgUnitList.vue
            - src/views/org/OrgChartView.vue

    - instruction: "修改【待办中心】的数据库字段"
      actions:
        - module: todo-center
          files:
            - database: todo_task 表
            - entity: src/TodoCenter.API/Models/TodoEntities.cs

    - instruction: "在【员工花名册】添加一个【导出员工画像】按钮"
      actions:
        - module: employee
          files:
            - frontend: src/views/employee/EmployeeList.vue (toolbar.buttons)
            - backend: src/HRMS.API/Controllers/EmployeesController.cs
            - permission: button.employee.exportPortrait (新增)
